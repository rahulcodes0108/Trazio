name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trazio
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -e ".[dev]"

      - name: Backend linting
        run: |
          cd backend
          ruff check .

      - name: Backend formatting check
        run: |
          cd backend
          ruff format --check .

      - name: Backend type checking
        run: |
          cd backend
          mypy app

      - name: Backend tests
        run: |
          cd backend
          pytest tests/ -v
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/trazio
          REDIS_URL: redis://localhost:6379/0

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Frontend type checking
        run: |
          cd frontend
          npm run type-check

      - name: Frontend linting
        run: |
          cd frontend
          npm run lint

      - name: Frontend build
        run: |
          cd frontend
          npm run build
