[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trazio-backend"
version = "0.1.0"
description = "Trazio backend API"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Trazio Team", email = "team@trazio.example"}
]

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.0",
    "python-dotenv>=1.0.0",
    "bcrypt>=4.0.0",
    "python-jose[cryptography]>=3.3.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "requests>=2.32.0",
    "ruff>=0.1.0",
    "geoalchemy2>=0.14.0",
    "email-validator>=2.0.0",
    "Shapely>=2.0,<3.0",
    "ortools>=9.10.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "types-psycopg2>=2.9.9",
]

[project.scripts]
trazio-backend = "app.main:app"

[tool.setuptools.packages.find]
where = ["."]
